[package]
name = "deskglide-gui"
description = "DeskGlide desktop GUI and system tray app for Windows 11 and Linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "deskglide-app"
path = "src/main.rs"

[dependencies]
deskglide-proto.workspace = true
deskglide-input.workspace = true
deskglide-net.workspace = true
deskglide-engine.workspace = true
eframe.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[package.metadata.deb]
name = "deskglide"
maintainer = "DeskGlide Contributors"
copyright = "2026, DeskGlide Contributors"
license-file = ["../../LICENSE-MIT", "0"]
section = "net"
priority = "optional"
depends = "$auto, udev, policykit-1"
extended-description = """
DeskGlide lets you control both your Windows and Linux PCs with a single
keyboard and mouse over encrypted local Wi-Fi/LAN (QUIC + TLS 1.3).
Works natively on both Wayland and X11.
"""
maintainer-scripts = "../../packaging/linux/debian"
assets = [
    ["../../target/release/deskglide-app", "usr/bin/", "755"],
    ["../../target/release/deskglide", "usr/bin/", "755"],
    ["../../packaging/linux/70-deskglide.rules", "usr/lib/udev/rules.d/70-deskglide.rules", "644"],
    ["../../packaging/linux/deskglide.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/deskglide.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../packaging/linux/deskglide-modules.conf", "etc/modules-load.d/deskglide.conf", "644"],
]
