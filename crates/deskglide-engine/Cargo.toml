[package]
name = "deskglide-engine"
description = "Shared async host/client KVM engine, clipboard sync, mDNS, and screen-edge orchestration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
deskglide-proto.workspace = true
deskglide-input.workspace = true
deskglide-net.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
sha2.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3.7", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
