name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libgl-dev libdbus-1-dev dpkg-dev
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Package Zorin/Ubuntu .deb and Portable tar.gz
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [[ "$VER" == "$GITHUB_REF_NAME" ]] || [[ -z "$VER" ]]; then VER="0.1.0"; fi
          chmod +x packaging/linux/debian/postinst scripts/linux/setup-uinput.sh
          mkdir -p dist/deb_pkg/DEBIAN dist/deb_pkg/usr/bin dist/deb_pkg/usr/lib/udev/rules.d dist/deb_pkg/usr/share/applications dist/deb_pkg/usr/share/icons/hicolor/scalable/apps dist/deb_pkg/etc/modules-load.d dist/portable_tmp

          install -m 755 target/release/deskglide-app dist/deb_pkg/usr/bin/deskglide-app
          install -m 755 target/release/deskglide dist/deb_pkg/usr/bin/deskglide
          install -m 644 packaging/linux/70-deskglide.rules dist/deb_pkg/usr/lib/udev/rules.d/70-deskglide.rules
          install -m 644 packaging/linux/deskglide.desktop dist/deb_pkg/usr/share/applications/deskglide.desktop
          install -m 644 packaging/linux/deskglide.svg dist/deb_pkg/usr/share/icons/hicolor/scalable/apps/deskglide.svg
          install -m 644 packaging/linux/deskglide-modules.conf dist/deb_pkg/etc/modules-load.d/deskglide.conf
          install -m 755 packaging/linux/debian/postinst dist/deb_pkg/DEBIAN/postinst

          SIZE_KB=$(du -sk dist/deb_pkg/usr dist/deb_pkg/etc | awk '{s+=$1} END {print s}')
          cat > dist/deb_pkg/DEBIAN/control <<EOF
          Package: deskglide
          Version: ${VER}
          Section: net
          Priority: optional
          Architecture: amd64
          Installed-Size: ${SIZE_KB}
          Depends: libc6, libgl1, udev, pkexec | policykit-1
          Maintainer: DeskGlide Contributors
          Description: Encrypted Wi-Fi/LAN keyboard & mouse sharing (Windows & Linux)
           DeskGlide lets you control both your Windows and Linux PCs with a single
           wireless keyboard and mouse over encrypted QUIC + TLS 1.3.
           Works natively on both Wayland and X11.
          EOF

          dpkg-deb --build --root-owner-group dist/deb_pkg dist/DeskGlide-Linux-Debian-Zorin-amd64.deb
          cp target/release/deskglide-app target/release/deskglide scripts/linux/setup-uinput.sh README.md LICENSE-MIT LICENSE-APACHE dist/portable_tmp/
          tar -czf dist/DeskGlide-Linux-Portable-x86_64.tar.gz -C dist/portable_tmp .
          rm -rf dist/deb_pkg dist/portable_tmp
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/DeskGlide-Linux-Debian-Zorin-amd64.deb
            dist/DeskGlide-Linux-Portable-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --release --workspace
      - name: Build Windows Installer (Inno Setup) and Portable ZIP
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME -match '^v(.+)$') { $matches[1] } else { "0.1.0" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          powershell -ExecutionPolicy Bypass -File scripts/windows/package-portable.ps1
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" packaging/windows/deskglide.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/DeskGlide-Windows-Setup-x64.exe
            dist/DeskGlide-Windows-Portable-x64.zip

  publish-release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ### Pick Only the Single File for Your OS

            | Operating System | Download | Notes |
            |---|---|---|
            | **Windows 11** (Installer) | `DeskGlide-Windows-Setup-x64.exe` | Adds Start Menu icon & firewall rule automatically |
            | **Windows 11** (Portable ZIP) | `DeskGlide-Windows-Portable-x64.zip` | Unzip and double-click `deskglide-app.exe` |
            | **Zorin OS / Ubuntu / Debian** | `DeskGlide-Linux-Debian-Zorin-amd64.deb` | Double-click to install (Wayland & X11 ready) |
            | **Other Linux (x86_64)** | `DeskGlide-Linux-Portable-x86_64.tar.gz` | Extract and run `./setup-uinput.sh` once |
